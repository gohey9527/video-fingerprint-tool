name: Build Windows Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg
        shell: cmd
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build Windows package
        shell: cmd
        run: build_windows.bat

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: video-fingerprint-tool-windows
          path: |
            release/短视频指纹工具-windows.zip
            release/使用说明-Windows.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        run: |
          if ! gh release view windows-latest >/dev/null 2>&1; then
            gh release create windows-latest \
              --title "Windows 最新版" \
              --notes "自动构建的 Windows 版本（内置 FFmpeg + MineAdmin API 登录）。"
          fi
          gh release upload windows-latest \
            "release/短视频指纹工具-windows.zip" \
            "release/使用说明-Windows.txt" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
