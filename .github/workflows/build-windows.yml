name: Build Windows Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg
        shell: cmd
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build Windows package
        shell: cmd
        run: build_windows.bat

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: video-fingerprint-tool-windows
          path: |
            release/短视频指纹工具-windows.zip
            release/使用说明-Windows.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows 最新版
          body: |
            自动构建的 Windows 版本（内置 FFmpeg + MineAdmin API 登录）。

            使用方法：
            1. 下载 `短视频指纹工具-windows.zip`
            2. 解压后双击 `短视频指纹工具.exe`
            3. 若 SmartScreen 拦截，点击“更多信息”→“仍要运行”
          files: |
            release/短视频指纹工具-windows.zip
            release/使用说明-Windows.txt
          draft: false
          prerelease: false
          make_latest: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
