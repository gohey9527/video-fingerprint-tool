name: Build macOS Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build macOS package
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: video-fingerprint-tool-macos
          path: |
            release/短视频指纹工具-macOS-*.zip
            release/使用说明.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        run: |
          if ! gh release view macos-latest >/dev/null 2>&1; then
            gh release create macos-latest \
              --title "macOS 最新版" \
              --notes "自动构建的 macOS 版本（内置 FFmpeg + MineAdmin API 登录）。"
          fi
          gh release upload macos-latest \
            release/短视频指纹工具-macOS-*.zip \
            release/使用说明.txt \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
