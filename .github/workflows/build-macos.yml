name: Build macOS Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build macOS package
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: video-fingerprint-tool-macos
          path: |
            release/短视频指纹工具-macOS-*.zip
            release/使用说明.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-latest
          name: macOS 最新版
          body: |
            自动构建的 macOS 版本（内置 FFmpeg + MineAdmin API 登录）。

            使用方法：
            1. 下载 `短视频指纹工具-macOS-arm64.zip`（Apple 芯片 Mac）
            2. 解压后将 `短视频指纹工具.app` 拖到「应用程序」
            3. 若提示无法打开：右键 → 打开
          files: |
            release/短视频指纹工具-macOS-*.zip
            release/使用说明.txt
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
